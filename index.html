<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07337c">
<link rel="manifest" href="./Manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./img/logo.png">
<link rel="apple-touch-icon" href="./img/logo.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="./fonts/lexend-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./app.css">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="./shared.js"></script>
<title>Trodia Fest | Minijuegos</title>
<meta name="apple-mobile-web-app-title" content="Trodia Fest">
<meta name="description" content="Minijuegos de Trodia Fest: test de reacción, ruleta de premios y pit stop.">
</head>
<body class="font-sans bg-ink text-ink flex flex-col" data-title="Minijuegos">
<header id="hdr"></header>
<main class="flex-1 min-h-0 overflow-y-auto">
  <div class="p-4 sm:p-8 max-w-4xl mx-auto">
    <div class="text-white text-center py-6">
      <p class="text-3xl sm:text-5xl font-extrabold leading-tight">¿A qué jugamos?</p>
      <p class="text-white/70 mt-2">Elegí un minijuego</p>
    </div>
    <div class="grid sm:grid-cols-3 gap-4">
      <a href="./reaccion.html" class="bg-white rounded-3xl p-6 active:scale-[.98] transition hover:-translate-y-1 block"><div class="h-28 sm:h-32 mb-3 flex items-center justify-center"><img src="./img/Reaccion.png" alt="" class="w-full h-full object-contain object-center" draggable="false" onerror="this.style.display='none'"></div><h2 class="text-xl font-extrabold">Test de <span class="text-or">reacción</span></h2><p class="text-mut text-sm mt-1">Salí cuando se apaguen las luces y entrá al ranking.</p></a>
      <a href="./pitstop.html" class="bg-white rounded-3xl p-6 active:scale-[.98] transition hover:-translate-y-1 block"><div class="h-28 sm:h-32 mb-3 flex items-center justify-center"><img src="./img/PITSTOP.png" alt="" class="w-full h-full object-contain object-center" draggable="false" onerror="this.style.display='none'"></div><h2 class="text-xl font-extrabold">Pit <span class="text-or">stop</span></h2><p class="text-mut text-sm mt-1">Sacá las 4 ruedas del monoplaza en el orden indicado.</p></a>
      <a href="./ruleta.html" class="bg-white rounded-3xl p-6 active:scale-[.98] transition hover:-translate-y-1 block"><div class="h-28 sm:h-32 mb-3 flex items-center justify-center"><img src="./img/ruleta.png" alt="" class="w-full h-full object-contain object-center" draggable="false" onerror="this.style.display='none'"></div><h2 class="text-xl font-extrabold">Ruleta <span class="text-or">de premios</span></h2><p class="text-mut text-sm mt-1">Girá y descubrí qué premio te toca.</p></a>
    </div>
    <div class="text-center mt-8"><button id="installBtn" type="button" class="btn !bg-white !text-or border-2 border-or hover:!bg-or hover:!text-white">⬇ Descargar app</button></div>
  </div>
</main>
</body>
</html>
