<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07337c">
<link rel="manifest" href="./Manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./img/logo.png">
<link rel="apple-touch-icon" href="./img/logo.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="./fonts/lexend-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./app.css">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="./shared.js"></script>
<title>Esquivar conos | Trodia Fest</title>
<meta name="apple-mobile-web-app-title" content="Conos">
<meta name="description" content="Esquivá los conos y sumá la mayor cantidad.">
<style>
#stage{background:#0a1a3f;border-color:#16306b}
.floor{background:radial-gradient(ellipse 70% 60% at 50% 55%,#1d3b80 0%,#0d2150 55%,#071230 100%)}

</style>
</head>
<body class="font-sans bg-ink text-ink flex flex-col" data-title='Esquivar <span class="text-or">conos</span>' data-back="1">
<header id="hdr"></header>
<main class="flex-1 min-h-0 overflow-y-auto">
 <div class="gm grid lg:grid-cols-[1.5fr_1fr] gap-3 p-3 sm:p-4 lg:h-full">
  <div id="stage" class="border-[3px] rounded-3xl p-3 sm:p-4 flex flex-col gap-3 min-h-[max(500px,calc(100dvh-140px))] lg:min-h-0">
    <div class="flex items-center justify-between gap-3">
      <div class="min-w-0">
        <div id="msg" class="font-bold uppercase tracking-wide text-white text-base sm:text-xl">Listo para esquivar</div>
        <div id="verdict" class="text-or font-semibold min-h-[1.3em] text-sm"></div>
        <div id="hint" class="text-[#9fb0d6] text-sm">Tocá <b>Comenzar</b> y esquivá los conos moviéndote entre los 3 carriles</div>
      </div>
      <div id="time" class="tm font-extrabold leading-none tabular-nums text-4xl sm:text-6xl text-white flex-none"></div>
    </div>
    <div id="floor" class="floor relative flex-1 min-h-[280px] rounded-2xl overflow-hidden flex items-center justify-center">
<canvas id="cv" class="h-full max-w-full block" style="aspect-ratio:9/14;touch-action:none" aria-label="Pista de conos"></canvas>
    </div>
    <button id="startBtn" type="button" class="btn self-center">Comenzar</button>
  </div>
  <aside id="side" class="flex flex-col gap-3 lg:min-h-0"></aside>
 </div>
</main>
<script>
(() => {
const {$}=TF;
const side=TF.side({logKey:'conos_v1',rankKey:'conos_ranking_v1',fmt:v=>v,unit:'conos',bad:'Error',higher:true});
const msg=$('msg'),verdict=$('verdict'),hint=$('hint'),timeEl=$('time'),startBtn=$('startBtn'),cv=$('cv'),ctx=cv.getContext('2d');
const W=360,H=560,LANES=[80,180,280],CAR_Y=470,dpr=Math.min(window.devicePixelRatio||1,3);
cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
const ST={IDLE:0,RUN:1,NAME:2,DONE:3};
let state=ST.IDLE,lane=1,x=180,rows=[],passed=0,dash=0,since=0,safe=1,last=0,raf=0,crashed=false;
TF.busy=()=>state===ST.RUN;
const rate=n=>n<5?'Calentando motores':n<15?'Buen pulso':n<30?'¡Gran esquive!':'¡Piloto de autocross!';
const gapPx=()=>Math.max(165,250-passed*2), speed=()=>Math.min(230+passed*9,540);
const setScore=()=>{timeEl.innerHTML=passed+'<small>conos</small>'};

function spawn(){
  safe=Math.max(0,Math.min(2,safe+[-1,0,1][Math.floor(Math.random()*3)]));
  const p=passed<6?.5:.85,others=[0,1,2].filter(l=>l!==safe);
  let ls=others.filter(()=>Math.random()<p);
  if(!ls.length)ls=[others[Math.random()<.5?0:1]];
  rows.push({y:-30,ls,done:false});
}
function drawCar(cx,cy,red){
  const f=(c,a,b,w,h)=>{ctx.fillStyle=c;ctx.fillRect(cx+a,cy+b,w,h)};
  f('#111',-36,-34,10,18);f('#111',26,-34,10,18);f('#111',-38,8,12,22);f('#111',26,8,12,22);
  f('#12161c',-26,-24,14,3);f('#12161c',12,-24,14,3);f('#12161c',-26,16,14,3);f('#12161c',12,16,14,3);
  f(red?'#e5251c':'#f7f9fc',-12,-36,24,62);f('#f25500',-4,-36,8,40);
  f('#222831',-30,-44,60,8);f('#f25500',-28,24,56,8);
  ctx.fillStyle='#151a22';ctx.beginPath();ctx.arc(cx,cy-2,6,0,7);ctx.fill();
}
function cone(cx,cy){
  ctx.fillStyle='#222831';ctx.fillRect(cx-15,cy-15,30,30);
  [['#f25500',13],['#fff',8.5],['#f25500',4.5]].forEach(([c,r])=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill()});
}
function draw(){
  ctx.fillStyle='#0a1a3f';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#1c2535';ctx.fillRect(30,0,300,H);
  ctx.fillStyle='#fff';ctx.fillRect(26,0,6,H);ctx.fillRect(328,0,6,H);
  ctx.fillStyle='rgba(255,255,255,.35)';
  for(let y=-40+dash;y<H;y+=40){ctx.fillRect(129,y,3,20);ctx.fillRect(229,y,3,20)}
  rows.forEach(r=>r.ls.forEach(l=>cone(LANES[l],r.y)));
  drawCar(x,CAR_Y,crashed);
  if(crashed){ctx.fillStyle='rgba(229,37,28,.25)';ctx.fillRect(0,0,W,H)}
}
function start(){
  cancelAnimationFrame(raf);lane=1;x=180;rows=[];passed=0;dash=0;safe=1;crashed=false;since=gapPx()-100;
  state=ST.RUN;msg.textContent='¡Esquivá los conos!';verdict.textContent='';startBtn.hidden=true;
  hint.textContent='Tocá la izquierda o la derecha de la pista (o usá ← →)';setScore();last=performance.now();raf=requestAnimationFrame(tick);
}
function tick(ts){
  const dt=Math.max(0,Math.min((ts-last)/1000,.05));last=ts;
  const sp=speed(),tx=LANES[lane];
  x+=Math.sign(tx-x)*Math.min(Math.abs(tx-x),1200*dt);
  dash=(dash+sp*dt)%40;since+=sp*dt;
  if(since>=gapPx()){since=0;spawn()}
  for(const r of rows){
    r.y+=sp*dt;
    if(!r.done&&r.y>CAR_Y+34){r.done=true;passed++;setScore()}
    if(r.ls.some(l=>Math.abs(LANES[l]-x)<28)&&Math.abs(r.y-CAR_Y)<40){crashed=true}
  }
  rows=rows.filter(r=>r.y<H+40);
  draw();
  if(crashed)return end();
  raf=requestAnimationFrame(tick);
}
function end(){
  state=ST.NAME;msg.textContent='¡Choque!';verdict.textContent=passed+' conos esquivados · '+rate(passed);hint.textContent='';side.log(passed);
  const done=()=>{hint.textContent='Cuantos más conos, mejor';state=ST.DONE;startBtn.textContent='Jugar otra vez';startBtn.hidden=false};
  if(!passed)return done();
  setTimeout(()=>TF.askName(passed+' conos',name=>{
    if(name){const pos=side.rank(name,passed);verdict.textContent=pos<=10?name+' · puesto #'+pos+' del ranking':name+' · fuera del top 10'}
    done();
  }),800);
}
const move=dir=>{if(state===ST.RUN)lane=Math.max(0,Math.min(2,lane+dir))};
cv.addEventListener('pointerdown',e=>{if(state!==ST.RUN)return;e.preventDefault();const r=cv.getBoundingClientRect();move(e.clientX-r.left<r.width/2?-1:1)});
startBtn.addEventListener('click',()=>{if(state===ST.IDLE||state===ST.DONE)start()});
document.addEventListener('keydown',e=>{
  if(e.repeat||TF.nameOpen)return;
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){e.preventDefault();move(-1)}
  else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){e.preventDefault();move(1)}
  else if((e.code==='Space'||e.code==='Enter')&&(state===ST.IDLE||state===ST.DONE)){e.preventDefault();start()}
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&state===ST.RUN){cancelAnimationFrame(raf);state=ST.IDLE;rows=[];crashed=false;x=180;lane=1;draw();msg.textContent='Partida cancelada';startBtn.textContent='Comenzar';startBtn.hidden=false}
});
draw();
})();
</script>
</body>
</html>
