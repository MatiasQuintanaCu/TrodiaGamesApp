<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07337c">
<link rel="manifest" href="./Manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./img/logo.png">
<link rel="apple-touch-icon" href="./img/logo.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="./fonts/lexend-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./app.css">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="./shared.js"></script>
<title>Armá el monoplaza | Trodia Fest</title>
<meta name="apple-mobile-web-app-title" content="Armar">
<meta name="description" content="Arrastrá las piezas y armá el monoplaza contra reloj.">
<style>
#stage{background:#0a1a3f;border-color:#16306b}
.floor{background:radial-gradient(ellipse 70% 60% at 50% 55%,#1d3b80 0%,#0d2150 55%,#071230 100%)}
.pc{cursor:grab}.pc.placed{pointer-events:none}
</style>
</head>
<body class="font-sans bg-ink text-ink flex flex-col" data-title='Armá el <span class="text-or">monoplaza</span>' data-back="1">
<header id="hdr"></header>
<main class="flex-1 min-h-0 overflow-y-auto">
 <div class="gm grid lg:grid-cols-[1.5fr_1fr] gap-3 p-3 sm:p-4 lg:h-full">
  <div id="stage" class="border-[3px] rounded-3xl p-3 sm:p-4 flex flex-col gap-3 min-h-[max(500px,calc(100dvh-140px))] lg:min-h-0">
    <div class="flex items-center justify-between gap-3">
      <div class="min-w-0">
        <div id="msg" class="font-bold uppercase tracking-wide text-white text-base sm:text-xl">Listo para armar</div>
        <div id="verdict" class="text-or font-semibold min-h-[1.3em] text-sm"></div>
        <div id="hint" class="text-[#9fb0d6] text-sm">Tocá <b>Comenzar</b> y arrastrá las 8 piezas a su lugar</div>
      </div>
      <div id="time" class="tm font-extrabold leading-none tabular-nums text-4xl sm:text-6xl text-white flex-none"></div>
    </div>
    <div id="floor" class="floor relative flex-1 min-h-[280px] rounded-2xl overflow-hidden flex items-center justify-center">
<svg id="sc" viewBox="0 0 800 600" class="w-full h-full block" style="touch-action:none" role="img" aria-label="Armá el monoplaza arrastrando las piezas a su lugar"></svg>
    </div>
    <button id="startBtn" type="button" class="btn self-center">Comenzar</button>
  </div>
  <aside id="side" class="flex flex-col gap-3 lg:min-h-0"></aside>
 </div>
</main>
<script>
(() => {
const {$}=TF;
const side=TF.side({logKey:'armar_v1',rankKey:'armar_ranking_v1',fmt:ms=>(ms/1000).toFixed(2),unit:'s',bad:'Error'});
const msg=$('msg'),verdict=$('verdict'),hint=$('hint'),timeEl=$('time'),startBtn=$('startBtn'),svg=$('sc');
const HINT='Arrastrá cada pieza a su lugar. Cada error suma 0.5 s';
const Wh=(w,h)=>`<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="18" fill="#151a21" stroke="#0b0e13" stroke-width="3"/><rect x="${-w/2+9}" y="${-h/2+12}" width="7" height="${h-24}" rx="3" fill="#262e3a"/><g stroke="#232a35" stroke-width="3" stroke-linecap="round">${[.25,.5,.75].map(f=>`<line x1="${-w/2+22}" y1="${-h/2+h*f}" x2="${w/2-8}" y2="${-h/2+h*f}"/>`).join('')}</g>`;
const DEF={
  rl:{z:0,slot:[230,222],w:70,h:110,s:Wh(70,110)},
  rr:{z:0,slot:[570,222],w:70,h:110,s:Wh(70,110)},
  fl:{z:0,slot:[130,352],w:84,h:128,s:Wh(84,128)},
  fr:{z:0,slot:[670,352],w:84,h:128,s:Wh(84,128)},
  bd:{z:1,slot:[400,265],w:170,h:230,s:`<path d="M-60 -105 C-84 -40 -78 40 -50 100 C-28 126 28 126 50 100 C78 40 84 -40 60 -105 C30 -118 -30 -118 -60 -105Z" fill="#f7f9fc" stroke="#cfd6e4" stroke-width="3"/><path d="M-54 -84 C-70 -30 -64 40 -42 90 L-31 84 C-50 38 -54 -30 -44 -80Z" fill="#f25500"/><path d="M54 -84 C70 -30 64 40 42 90 L31 84 C50 38 54 -30 44 -80Z" fill="#f25500"/><rect x="-23" y="30" width="46" height="30" fill="#fff"/><rect x="-23" y="36" width="46" height="4" fill="#2b6cc4"/><rect x="-23" y="46" width="46" height="4" fill="#2b6cc4"/>`},
  rw:{z:2,slot:[400,70],w:290,h:70,s:`<rect x="-135" y="-28" width="270" height="52" rx="6" fill="#f4f6fa" stroke="#cfd6e4" stroke-width="3"/><text y="10" text-anchor="middle" font-size="30" font-weight="800" fill="#f25500" font-family="Lexend,system-ui,sans-serif" letter-spacing="1">TRODIA</text><path d="M-146 -34 L-136 -30 L-136 28 L-142 26Z" fill="#f25500"/><path d="M146 -34 L136 -30 L136 28 L142 26Z" fill="#f25500"/>`},
  fw:{z:2,slot:[400,435],w:410,h:64,s:`<path d="M-190 -16 L190 -16 L178 24 L-178 24Z" fill="#222831"/><path d="M-150 -26 L150 -26 L142 -14 L-142 -14Z" fill="#2b323d"/><rect x="-204" y="-32" width="18" height="64" rx="4" fill="#f25500"/><rect x="186" y="-32" width="18" height="64" rx="4" fill="#f25500"/>`},
  hm:{z:3,slot:[400,236],w:60,h:70,s:`<rect x="-30" y="-8" width="60" height="42" rx="16" fill="#151a22"/><rect x="-20" y="-34" width="40" height="30" rx="10" fill="#1d242e"/>`}
};
const KEYS=Object.keys(DEF),PAD=28;
svg.innerHTML=`<defs>${KEYS.map(k=>`<g id="s-${k}">${DEF[k].s}</g>`).join('')}</defs>
<ellipse cx="400" cy="452" rx="330" ry="18" fill="#000" opacity=".3"/>
<g stroke="#12161c" stroke-width="6" stroke-linecap="round" fill="none"><path d="M360 96 L372 170"/><path d="M440 96 L428 170"/><path d="M330 210 L230 222"/><path d="M470 210 L570 222"/><path d="M330 300 L130 352"/><path d="M470 300 L670 352"/></g>
<rect id="panel" y="474" width="800" height="126" fill="#071230"/>
${KEYS.map(k=>`<use href="#s-${k}" transform="translate(${DEF[k].slot[0]} ${DEF[k].slot[1]})" style="filter:brightness(0) invert(1);opacity:.18"/>`).join('')}
<g id="pcs">${KEYS.map(k=>`<g class="pc" data-k="${k}"><rect x="${-DEF[k].w/2-PAD}" y="${-DEF[k].h/2-PAD}" width="${DEF[k].w+2*PAD}" height="${DEF[k].h+2*PAD}" fill="transparent"/><use href="#s-${k}"/></g>`).join('')}</g>`;
const pcs=svg.querySelector('#pcs'),panel=svg.querySelector('#panel');
KEYS.forEach(k=>{DEF[k].g=pcs.querySelector(`[data-k="${k}"]`)});

const ST={IDLE:0,RUN:1,NAME:2,DONE:3};
let state=ST.IDLE,t0=0,penal=0,placed=0,raf=0,drag=null,hintT=0,order=[...KEYS],homes=[],tall=false,cell=84;
TF.busy=()=>state===ST.RUN;
const tf=(g,x,y,k,tr)=>{g.style.transition=tr;g.style.transform=`translate(${x}px,${y}px) scale(${k})`};
const sortZ=()=>[...pcs.children].sort((a,b)=>DEF[a.dataset.k].z-DEF[b.dataset.k].z).forEach(g=>pcs.appendChild(g));
/* El alto del dibujo se adapta a la pantalla: en el celular vertical la bandeja pasa a 2 filas con piezas grandes */
function fit(){
  const r=svg.getBoundingClientRect(),cw=r.width||800,ch=r.height||600;
  const VH=Math.round(Math.max(600,Math.min(1150,800*ch/cw)));
  svg.setAttribute('viewBox',`0 0 800 ${VH}`);panel.setAttribute('height',VH-474);
  tall=VH>680;cell=tall?170:84;
  homes=KEYS.map((_,i)=>tall?[100+(i%4)*200,474+(VH-474)*(i<4?.27:.73)]:[50+i*100,540]);
}
const homeOf=(i,k)=>{const p=DEF[k];return [homes[i][0],homes[i][1],Math.min(tall?1:.6,cell/Math.max(p.w,p.h))]};
function layout(o){order=o;o.forEach((k,i)=>{const p=DEF[k];p.placed=false;p.g.classList.remove('placed');p.home=homeOf(i,k);tf(p.g,...p.home,'transform .25s')});sortZ()}
function rehome(){order.forEach((k,i)=>{const p=DEF[k];p.home=homeOf(i,k);if(!p.placed&&drag!==k)tf(p.g,...p.home,'none')})}
new ResizeObserver(()=>{fit();rehome()}).observe(svg);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const elapsed=()=>performance.now()-t0+penal*500;
const setTime=ms=>{timeEl.innerHTML=(ms/1000).toFixed(2)+'<small>s</small>'};
const rate=ms=>ms<15000?'¡Mecánico de F1!':ms<25000?'Muy rápido':ms<40000?'Buen ritmo':'A practicar el armado';
const flash=t=>{hint.textContent=t;clearTimeout(hintT);hintT=setTimeout(()=>{if(state===ST.RUN)hint.textContent=HINT},1400)};
fit();layout(KEYS);setTime(0);

function start(){
  cancelAnimationFrame(raf);fit();layout(shuffle([...KEYS]));placed=0;penal=0;drag=null;
  state=ST.RUN;msg.textContent='¡Armalo lo más rápido posible!';verdict.textContent='';hint.textContent=HINT;startBtn.hidden=true;
  t0=performance.now();(function tick(){if(state!==ST.RUN)return;setTime(elapsed());raf=requestAnimationFrame(tick)})();
}
function finish(){
  const ms=Math.round(elapsed());state=ST.NAME;cancelAnimationFrame(raf);setTime(ms);
  msg.textContent='¡Monoplaza armado!';verdict.textContent=rate(ms)+(penal?' · +'+(penal*.5)+' s por errores':'');hint.textContent='';side.log(ms);
  setTimeout(()=>TF.askName((ms/1000).toFixed(2)+' s',name=>{
    if(name){const pos=side.rank(name,ms);verdict.textContent=pos<=10?name+' · puesto #'+pos+' del ranking':name+' · fuera del top 10'}
    state=ST.DONE;hint.textContent='Tocá Jugar otra vez para un nuevo orden';startBtn.textContent='Jugar otra vez';startBtn.hidden=false;
  }),900);
}
const toSvg=e=>{const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse())};
const scale=()=>svg.getScreenCTM().a||1;
const lift=e=>e.pointerType==='touch'?-56/scale():0;   /* la pieza queda arriba del dedo */
svg.addEventListener('pointerdown',e=>{
  const g=e.target.closest('.pc');if(!g||state!==ST.RUN)return;
  const k=g.dataset.k;if(DEF[k].placed)return;
  e.preventDefault();drag=k;g.setPointerCapture(e.pointerId);pcs.appendChild(g);
  const q=toSvg(e);tf(g,q.x,q.y+lift(e),1,'none');
});
svg.addEventListener('pointermove',e=>{if(!drag)return;const q=toSvg(e);tf(DEF[drag].g,q.x,q.y+lift(e),1,'none')});
function drop(e){
  if(!drag)return;
  const k=drag,p=DEF[k];drag=null;
  const q=toSvg(e),x=q.x,y=q.y+lift(e),[sx,sy]=p.slot,R=Math.max(50,30/scale());   /* tolerancia ≈ 30 px de pantalla */
  if(Math.hypot(x-sx,y-sy)<R){
    p.placed=true;p.g.classList.add('placed');tf(p.g,sx,sy,1,'transform .15s');sortZ();placed++;
    if(placed===KEYS.length)finish();
  }else{
    if(KEYS.some(o=>o!==k&&!DEF[o].placed&&Math.hypot(x-DEF[o].slot[0],y-DEF[o].slot[1])<R)){penal++;flash('Esa pieza va en otro lugar: +0.5 s')}
    tf(p.g,...p.home,'transform .25s');
  }
}
svg.addEventListener('pointerup',drop);svg.addEventListener('pointercancel',drop);
startBtn.addEventListener('click',()=>{if(state===ST.IDLE||state===ST.DONE)start()});
document.addEventListener('keydown',e=>{if(e.repeat||TF.nameOpen)return;if((e.code==='Space'||e.code==='Enter')&&(state===ST.IDLE||state===ST.DONE)){e.preventDefault();start()}});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&state===ST.RUN){cancelAnimationFrame(raf);state=ST.IDLE;drag=null;layout(KEYS);setTime(0);msg.textContent='Prueba cancelada';startBtn.textContent='Comenzar';startBtn.hidden=false}
});
})();
</script>
</body>
</html>
