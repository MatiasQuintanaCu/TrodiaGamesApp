<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07337c">
<link rel="manifest" href="./Manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="./fonts/lexend-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./app.css">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="./shared.js"></script>
<title>Ruleta de premios | Trodia Fest</title>
<meta name="apple-mobile-web-app-title" content="Ruleta">
<meta name="description" content="Girá la ruleta y descubrí qué premio te toca.">
<style>
.wa{container-type:size;display:grid;place-items:center;min-height:340px}
.ww{position:relative;width:min(86cqw,86cqh);aspect-ratio:1}
#wheelSvg{position:relative;width:100%;height:100%;border-radius:50%;display:block;box-shadow:inset 0 0 0 6px #fff;transition:transform 4.2s cubic-bezier(.17,.67,.12,.99)}
.ptr{position:absolute;top:-6%;left:50%;transform:translateX(-50%);z-index:5;border-left:14px solid transparent;border-right:14px solid transparent;border-top:28px solid #f25500}
.res{opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s}.res.show{opacity:1;transform:none}
</style>
</head>
<body class="font-sans bg-ink text-ink flex flex-col" data-title='Ruleta <span class="text-or">de premios</span>' data-back="1">
<header id="hdr"></header>
<main class="flex-1 min-h-0 overflow-y-auto">
 <div class="grid lg:grid-cols-[1.5fr_1fr] gap-3 p-3 sm:p-4 lg:h-full">
  <div class="bg-white border-[3px] border-line rounded-3xl p-4 flex flex-col items-center gap-3 min-h-[520px] lg:min-h-0">
    <div class="w-full flex items-center justify-between gap-3">
      <div class="min-w-0">
        <div id="rMsg" class="font-bold uppercase tracking-wide text-base sm:text-xl">Cargá los premios para empezar</div>
        <div id="rHint" class="text-mut text-sm">Agregalos en el panel y tocá "Actualizar ruleta"</div>
      </div>
      <div id="resultValue" class="res font-extrabold text-or text-right text-2xl sm:text-4xl leading-tight break-words" aria-live="polite">—</div>
    </div>
    <div class="wa flex-1 min-h-0 w-full">
      <div class="ww">
        <div class="ptr"></div>
        <div class="absolute rounded-full bg-ink" style="inset:-2.4%"></div>
        <svg id="wheelSvg" viewBox="0 0 400 400" role="img" aria-label="Ruleta de premios"></svg>
        <div class="absolute top-1/2 left-1/2 w-[13%] h-[13%] bg-white border-[5px] border-or rounded-full z-[4]" style="transform:translate(-50%,-50%)"></div>
      </div>
    </div>
    <button id="spinBtn" type="button" class="btn" disabled>Girar</button>
  </div>
  <aside class="card flex flex-col lg:min-h-0 min-h-[360px]">
    <h2>Premios en juego</h2>
    <p class="text-mut text-sm mb-2">Agregá los premios y elegí cuántos espacios quedan como "Sigue participando".</p>
    <div id="prizeList" class="flex-1 min-h-0 overflow-auto flex flex-col gap-2"></div>
    <button id="addPrizeBtn" type="button" class="mt-3 border-2 border-dashed border-ink rounded-xl py-2 font-semibold hover:border-or hover:text-or">+ Agregar premio</button>
    <div class="flex items-center justify-between gap-3 mt-3 pt-3 border-t border-line">
      <label for="slotsInput" class="text-sm font-medium">Espacios "Sigue participando"</label>
      <input type="number" id="slotsInput" min="0" max="20" value="0" inputmode="numeric" class="pin !w-20 text-center font-bold">
    </div>
    <button id="buildBtn" type="button" class="btn mt-3 w-full">Actualizar ruleta</button>
  </aside>
 </div>
</main>
<script>
(() => {
const {$,load,save}=TF;
const R_KEY='ruleta_v1',MAX=20,FILLER='Sigue participando',COLORS=['#07337c','#f25500'],THIRD='#0a46a8';
const svg=$('wheelSvg'),spinBtn=$('spinBtn'),resultEl=$('resultValue'),prizeList=$('prizeList'),slotsInput=$('slotsInput');
let options=[],rot=0,spinning=false,placeholder=true,prizes=[],pid=0,slots=0;
{const s=load(R_KEY,null);if(s&&Array.isArray(s.prizes)){prizes=s.prizes.map(v=>({id:pid++,value:String(v)}));slots=Math.max(0,Math.min(MAX,parseInt(s.slots,10)||0))}}
const rSave=()=>save(R_KEY,{prizes:prizes.map(p=>p.value),slots});
TF.busy=()=>spinning;
const polar=(cx,cy,r,d)=>{const a=(d-90)*Math.PI/180;return{x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)}};
const slicePath=(cx,cy,r,a0,a1)=>{const s=polar(cx,cy,r,a1),e=polar(cx,cy,r,a0);return `M ${cx} ${cy} L ${s.x} ${s.y} A ${r} ${r} 0 ${a1-a0<=180?0:1} 0 ${e.x} ${e.y} Z`};

function buildWheel(list){
  placeholder=list.length<2;
  options=placeholder?['Agregá','premios']:list.slice(0,MAX);
  const n=options.length,seg=360/n,ns='http://www.w3.org/2000/svg';
  svg.innerHTML='';
  for(let i=0;i<n;i++){
    const a0=i*seg,mid=a0+seg/2;
    let fill=COLORS[i%2];if(n%2===1&&i===n-1)fill=THIRD;if(placeholder)fill=i%2?'#dcdee4':'#c7cad4';
    const p=document.createElementNS(ns,'path');
    p.setAttribute('d',slicePath(200,200,196,a0,a0+seg));p.setAttribute('fill',fill);p.setAttribute('stroke','#fff');p.setAttribute('stroke-width','3');
    svg.appendChild(p);
    const pos=polar(200,200,196*.6,mid),t=document.createElementNS(ns,'text');
    t.setAttribute('x',pos.x);t.setAttribute('y',pos.y);t.setAttribute('fill',placeholder?'#8a8f9c':'#fff');
    t.setAttribute('font-family','Lexend, system-ui, sans-serif');t.setAttribute('font-weight','600');
    t.setAttribute('font-size',n>14?'11':n>8?'13':'16');t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','middle');
    t.setAttribute('transform',`rotate(${mid<=180?mid-90:mid+90}, ${pos.x}, ${pos.y})`);
    t.textContent=options[i].length>18?options[i].slice(0,17)+'…':options[i];
    svg.appendChild(t);
  }
  spinBtn.disabled=placeholder;resultEl.classList.remove('show');
  $('rMsg').textContent=placeholder?'Cargá los premios para empezar':'¡Lista para girar!';
  $('rHint').textContent=placeholder?'Agregalos en el panel y tocá "Actualizar ruleta"':'Tocá Girar y mirá dónde frena';
  rot%=360;svg.style.transition='none';svg.style.transform=`rotate(${rot}deg)`;void svg.getBoundingClientRect();svg.style.transition='';
}
function spin(){
  if(spinning||placeholder)return;
  spinning=true;spinBtn.disabled=true;resultEl.classList.remove('show');
  $('rMsg').textContent='Girando…';$('rHint').textContent='';
  const seg=360/options.length;
  rot+=(5+Math.floor(Math.random()*4))*360+Math.random()*360;svg.style.transform=`rotate(${rot}deg)`;
  let done=false;
  const finish=()=>{
    if(done)return;done=true;svg.removeEventListener('transitionend',onEnd);clearTimeout(fb);
    const ang=(360-(((rot%360)+360)%360))%360;
    resultEl.textContent=options[Math.floor(ang/seg)%options.length];resultEl.classList.add('show');
    $('rMsg').textContent='¡Salió!';$('rHint').textContent='Tocá Girar para otra vuelta';spinning=false;spinBtn.disabled=false;
  };
  const onEnd=e=>{if(e.target===svg)finish()};
  svg.addEventListener('transitionend',onEnd);const fb=setTimeout(finish,4600);
}
spinBtn.addEventListener('click',spin);

function renderPrizes(){
  prizeList.innerHTML='';
  if(!prizes.length){prizeList.innerHTML='<div class="text-mut text-sm py-1">Todavía no agregaste premios. Tocá "+ Agregar premio" para empezar.</div>';return}
  prizes.forEach((pr,i)=>{
    const row=document.createElement('div');row.className='flex items-center gap-2';
    row.innerHTML=`<span class="font-extrabold text-or min-w-[2ch]">${String(i+1).padStart(2,'0')}</span><input type="text" class="pin" placeholder="Nombre del premio" maxlength="40"><button type="button" aria-label="Quitar premio" class="flex-none w-9 h-9 rounded-full border-2 border-line text-mut text-xl leading-none hover:border-red hover:text-red">×</button>`;
    const inp=row.children[1];inp.value=pr.value;
    inp.addEventListener('input',()=>{pr.value=inp.value;rSave()});
    row.children[2].addEventListener('click',()=>{prizes=prizes.filter(p=>p.id!==pr.id);rSave();renderPrizes()});
    prizeList.appendChild(row);
  });
}
$('addPrizeBtn').addEventListener('click',()=>{
  prizes.push({id:pid++,value:''});rSave();renderPrizes();
  const l=[...prizeList.querySelectorAll('input')].pop();if(l){l.focus();l.scrollIntoView({block:'nearest'})}
});
const clampSlots=()=>Math.max(0,Math.min(MAX,parseInt(slotsInput.value,10)||0));
slotsInput.addEventListener('input',()=>{slots=clampSlots();rSave()});
$('buildBtn').addEventListener('click',()=>{
  if(spinning)return;
  slots=clampSlots();slotsInput.value=slots;rSave();
  buildWheel([...prizes.map(p=>p.value.trim()).filter(Boolean),...Array(slots).fill(FILLER)]);
});
slotsInput.value=slots;renderPrizes();
buildWheel([...prizes.map(p=>p.value.trim()).filter(Boolean),...Array(slots).fill(FILLER)]);
})();
</script>
</body>
</html>
